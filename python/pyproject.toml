[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "traderail"
version = "1.0.0"
description = "Official Python SDK for the TradeRail managed MetaTrader 5 (MT5) API."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "TradeRail" }]
keywords = ["mt5", "metatrader", "metatrader5", "trading", "forex", "trading-api", "copy-trading"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = ["requests>=2.25"]

[project.urls]
Homepage = "https://traderail.cloud"
Documentation = "https://traderail.cloud/docs.html"
Repository = "https://github.com/blockmob/trade-rail-sdk"
Issues = "https://github.com/blockmob/trade-rail-sdk/issues"

[tool.hatch.build.targets.wheel]
packages = ["traderail"]

[tool.hatch.build.targets.sdist]
only-include = [
    "traderail",
    "README.md",
    "LICENSE",
]
